[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "animl-world"
version = "0.1.0"
description = "aniML World — ecosystem RL (Isaac Lab) + Unity 6 deployment"
readme = "README.md"
requires-python = ">=3.10,<3.13"
dependencies = [
  "numpy>=1.26,<2",
  "PyYAML>=6.0",
  "gymnasium>=0.29,<1.0",
]

[project.optional-dependencies]
dev = ["ruff"]

[tool.setuptools.packages.find]
where = ["."]
